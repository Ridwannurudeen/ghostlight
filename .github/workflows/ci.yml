name: test-build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: install dependencies
        run: npm ci
      - name: verify direct dependencies
        run: npm ls --depth=0
      - name: npm run build
        run: npm run build
      - name: npm test
        run: npm test

  api-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: ghostlight_test
          POSTGRES_PASSWORD: ghostlight_test
          POSTGRES_DB: ghostlight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghostlight_test -d ghostlight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://ghostlight_test:ghostlight_test@localhost:5432/ghostlight_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: install API dependencies
        run: npm ci
      - name: verify API direct dependencies
        run: npm ls --depth=0
      - name: test API
        run: npm test
      - name: type-check API
        run: npm run check
      - name: build API
        run: npm run build
